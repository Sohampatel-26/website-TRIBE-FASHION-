<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribe Fashion - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #9066ce 0%, #62b1ea 100%);
            padding: 20px 0;
            box-shadow: 0 2px 20px rgba(144, 102, 206, 0.15);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            background: linear-gradient(180deg, rgba(144, 102, 206, 0.02) 0%, rgba(255, 255, 255, 1) 20%);
        }

        .login-container {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 
                0 20px 60px rgba(144, 102, 206, 0.08),
                0 8px 25px rgba(98, 177, 234, 0.06);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(144, 102, 206, 0.08);
        }

        .welcome-text {
            text-align: center;
            margin-bottom: 40px;
        }

        .welcome-text h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .welcome-text p {
            color: #718096;
            font-size: 1rem;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 16px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            background: #f8fafc;
            color: #2d3748;
        }

        .form-group input:focus {
            outline: none;
            border-color: #9066ce;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(144, 102, 206, 0.1);
            transform: translateY(-1px);
        }

        .form-group input::placeholder {
            color: #a0aec0;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #9066ce 0%, #62b1ea 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(144, 102, 206, 0.3);
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #8055c4 0%, #5aa8e6 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(144, 102, 206, 0.4);
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #4a5568;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #9066ce;
        }

        .forgot-password {
            color: #9066ce;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #8055c4;
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
            color: #a0aec0;
            font-size: 0.9rem;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e2e8f0;
            z-index: 1;
        }

        .divider span {
            background: white;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        .signup-link {
            text-align: center;
            color: #718096;
            font-size: 0.95rem;
        }

        .signup-link a {
            color: #9066ce;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .signup-link a:hover {
            color: #8055c4;
            text-decoration: underline;
        }

        .social-login {
            margin-top: 20px;
        }

        .social-btn {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            color: #4a5568;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .social-btn:hover {
            border-color: #9066ce;
            background: rgba(144, 102, 206, 0.02);
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 40px 30px;
                margin: 20px 10px;
                border-radius: 16px;
            }
            
            .welcome-text h2 {
                font-size: 1.5rem;
            }
            
            .form-group input {
                padding: 14px 16px;
            }
            
            .login-btn {
                padding: 14px;
            }
            
            .form-options {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">Tribe Fashion</div>
        </div>
    </div>
    
    <div class="main-content">
        <div class="login-container">
            <div class="welcome-text">
                <h2>Welcome Back</h2>
                <p>Sign in to your Tribe Fashion account</p>
            </div>


          <form id="loginForm" action="{{ url_for('login') }}" method="POST">

  <div class="form-group">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" placeholder="Enter your username" required>
</div>

    
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
    </div>
    
    <div class="form-options">
        <label class="remember-me">
            <input type="checkbox" id="remember" name="remember">
            Remember me
        </label>
        <a href="#" class="forgot-password" onclick="showMessage('Password reset link would be sent to your email')">Forgot Password?</a>
    </div>
    
    <button type="submit" class="login-btn">Sign In</button>
    
    <div class="divider">
        <span>or continue with</span>
    </div>
    
    <div class="signup-link">
        Don't have an account? <a href="#" onclick="showMessage('Sign up form would appear here')">Create Account</a>
    </div>
</form>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        
        if (username && password) {
            showMessage('Demo: Welcome back, Admin! Login successful.', 'success');
            setTimeout(() => {
                window.location.href = this.action; // redirects to admin-dashboard.html or your specified action
            }, 1500);
        } else {
            showMessage('Please fill in all required fields.', 'error');
        }
    });

    function showMessage(message, type = 'success') {
        const messageDiv = document.createElement('div');
        const bgGradient = type === 'success' 
            ? 'linear-gradient(135deg, #9066ce, #62b1ea)' 
            : 'linear-gradient(135deg, #e53e3e, #fc8181)';
        
        messageDiv.style.cssText = `
            position: fixed;
            top: 30px;
            right: 30px;
            background: ${bgGradient};
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            box-shadow: 0 8px 25px rgba(144, 102, 206, 0.3);
            z-index: 1000;
            animation: slideIn 0.4s ease;
            max-width: 350px;
            backdrop-filter: blur(10px);
        `;
        messageDiv.textContent = message;
        
        if (!document.querySelector('#messageAnimation')) {
            const style = document.createElement('style');
            style.id = 'messageAnimation';
            style.textContent = `
                @keyframes slideIn {
                    from { 
                        transform: translateX(100%) translateY(-10px); 
                        opacity: 0; 
                    }
                    to { 
                        transform: translateX(0) translateY(0); 
                        opacity: 1; 
                    }
                }
            `;
            document.head.appendChild(style);
        }
        
        document.body.appendChild(messageDiv);
        
        setTimeout(() => {
            messageDiv.style.animation = 'slideIn 0.4s ease reverse';
            setTimeout(() => messageDiv.remove(), 400);
        }, 3500);
    }
</script>
